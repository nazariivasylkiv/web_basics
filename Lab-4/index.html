<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторна робота 4</title>
  </head>
  <body>
    <h1>Моя перша HTML-форма</h1>
    <form action="https://httpbin.org/post" method="POST">
      <label for="usermane">Ваше ім'я:</label>
      <input type="text" id="username" name="username" />
      <p>
        <label>
          Дата народження:
          <input type="date" name="birthdate" />
        </label>
      </p>
      <p>
        <label for="email">Електронна пошта:</label>
        <input type="email" id="email" name="email" />
      </p>
      <p>
        <label for="message">Ваше повідомлення:</label>
        <textarea id="message" name="message" rows="5" cols="40"></textarea>
      </p>
      <p>Ваші улюблені марки авто?</p>
      <label>
        <input type="checkbox" name="car_Mazda" value="mazda" /> Mazda</label
      ><br />
      <label>
        <input type="checkbox" name="car_Volkswagen" value="Volkswagen" />
        Volkswagen</label
      ><br />
      <label>
        <input type="checkbox" name="car_Toyota" value="Toyota" /> Toyota</label
      ><br />
      <label> <input type="checkbox" name="car_BMW" value="BMW" /> BMW</label
      ><br />
      <p>Ваша улюблена коробка передач?</p>
      <label>
        <input type="radio" name="gearbox" value="mechanika" /> Механічна</label
      ><br />
      <label>
        <input type="radio" name="gearbox" value="automat" /> Автоматичка</label
      ><br />
      <label> <input type="radio" name="gearbox" value="robot" /> Робот</label
      ><br />
      <label>
        <input type="radio" name="gearbox" value="variator" /> Варіатор</label
      >
      <p>
        <button type="submit">Надіслати</button>
        <button type="reset">очистити</button>
      </p>
    </form>
    <h2>Адаптивне зображення</h2>
    <picture>
      <source
        media="(max-width: 467px)"
        srcset="https://picsum.photos/id/1018/300/500"
      />
      <img
        src="https://picsum.photos/id/1018/1000/400"
        alt="Демонстраційне зображення"
        style="max-width: 100%; height: auto"
      />
    </picture>
    <script type="module" src="./index.mjs"></script>
  </body>
</html>
